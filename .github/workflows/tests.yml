name: Tests

on:
  push:
  pull_request:

jobs:
  check:
    # The desktop app targets Windows, so the tests run there too.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
        env:
          # The tests never start Electron; skipping its download keeps the job short.
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Syntax, formatting and tests
        run: npm run check
